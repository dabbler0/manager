<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #252836;
      --border: #2e3248;
      --accent: #6c63ff;
      --accent2: #ff6584;
      --text: #e2e4f0;
      --muted: #7a7f9a;
      --green: #4ade80;
      --yellow: #facc15;
      --red: #f87171;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 14px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 { font-size: 16px; font-weight: 600; color: var(--accent); }

    .header-controls { display: flex; gap: 8px; align-items: center; }

    .main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Hero Panel ── */
    .hero-panel {
      width: 50%;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .hero-panel h2 {
      padding: 14px 18px 0;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }

    .hero-now {
      padding: 18px;
      flex-shrink: 0;
    }

    .hero-task-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px;
    }

    .hero-task-card .task-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero-task-card .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .hero-task-card .task-meta span { display: flex; align-items: center; gap: 4px; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
    }

    .badge-green { background: #14532d; color: var(--green); }
    .badge-yellow { background: #422006; color: var(--yellow); }
    .badge-red { background: #450a0a; color: var(--red); }

    .hero-mode {
      padding: 0 18px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .hero-mode strong { color: var(--text); }

    .hero-sequence {
      flex: 1;
      overflow-y: auto;
      padding: 0 18px 18px;
    }

    .hero-sequence h3 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .sequence-list { list-style: none; }

    .sequence-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .sequence-list li:last-child { border-bottom: none; }

    .seq-num {
      color: var(--accent);
      font-weight: 700;
      min-width: 20px;
    }

    .seq-info { flex: 1; }
    .seq-info .seq-title { font-weight: 500; }
    .seq-info .seq-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }

    /* ── Task List Panel ── */
    .tasks-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .tasks-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--surface);
    }

    .tasks-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .task-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: default;
    }

    .task-item:hover { border-color: var(--accent); }

    .task-item.done { opacity: .45; }

    .task-item .task-check {
      margin-top: 2px;
      cursor: pointer;
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
    }

    .task-item .task-body { flex: 1; min-width: 0; }

    .task-item .task-name {
      font-weight: 600;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .task-item .task-name.done-text { text-decoration: line-through; color: var(--muted); }

    .task-item .task-details {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .task-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    /* ── Buttons ── */
    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 6px 12px;
      font-size: 13px;
      font-family: inherit;
      transition: opacity .15s;
    }

    button:hover { opacity: .85; }
    button:disabled { opacity: .4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: transparent; color: var(--muted); padding: 4px 8px; }
    .btn-ghost:hover { color: var(--text); }
    .btn-danger { background: #450a0a; color: var(--red); }
    .btn-sm { padding: 4px 8px; font-size: 12px; }

    /* ── Inputs ── */
    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }

    .form-row { margin-bottom: 12px; }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 520px;
      max-width: 96vw;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 { font-size: 16px; margin-bottom: 18px; }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 18px;
    }

    /* split subtask rows */
    .subtask-row {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 8px;
    }

    .subtask-row-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .subtask-row-header span { font-size: 12px; color: var(--muted); }

    /* settings bar */
    .setting-label { color: var(--muted); font-size: 12px; }
    .setting-val { color: var(--text); font-size: 12px; font-weight: 600; }

    /* dep tags */
    .dep-list { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .dep-tag {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 11px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .dep-tag button { background: none; color: var(--red); padding: 0; font-size: 13px; line-height: 1; }

    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    .empty-state {
      text-align: center;
      color: var(--muted);
      padding: 40px 20px;
    }

    .hero-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
    }

    select option { background: var(--surface2); }

    .indent-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-left: 2px solid var(--accent);
      border-bottom: 2px solid var(--accent);
      margin-right: 4px;
      margin-left: 4px;
    }

    .overdue { color: var(--red) !important; }
  </style>
</head>
<body>

<header>
  <h1>⚡ Task Manager</h1>
  <div class="header-controls">
    <span class="setting-label">Hours/day:</span>
    <input type="number" id="hoursPerDay" value="8" min="1" max="24" style="width:56px;" />
    <button class="btn-primary" id="btnAdd">+ New Task</button>
  </div>
</header>

<div class="main-layout">
  <!-- Hero -->
  <div class="hero-panel">
    <h2>What to do now</h2>
    <div id="heroContent"></div>
  </div>

  <!-- Tasks -->
  <div class="tasks-panel">
    <div class="tasks-toolbar">
      <input type="text" id="searchInput" placeholder="Search tasks…" style="max-width:260px;" />
      <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:13px;color:var(--muted);cursor:pointer;">
        <input type="checkbox" id="showDone" style="width:auto;" /> Show completed
      </label>
    </div>
    <div class="tasks-list" id="tasksList"></div>
  </div>
</div>

<!-- Modal placeholder -->
<div id="modalContainer"></div>

<script>
// ═══════════════════════════════════════════════════════
// DATA MODEL
// ═══════════════════════════════════════════════════════

const STORAGE_KEY = 'taskmanager_v1';

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function loadTasks() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch { return []; }
}

function saveTasks(tasks) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
}

// task shape:
// { id, title, dueDate: ISO string | null (null = sometime), costOfFailure, benefitOfSuccess, estimatedHours, deps: [id,...], done: bool }

let tasks = loadTasks();

// ═══════════════════════════════════════════════════════
// TOPOLOGICAL SORT
// ═══════════════════════════════════════════════════════

function topoSort(taskList) {
  const map = new Map(taskList.map(t => [t.id, t]));
  const visited = new Set();
  const result = [];

  function visit(t) {
    if (visited.has(t.id)) return;
    visited.add(t.id);
    for (const depId of (t.deps || [])) {
      if (map.has(depId)) visit(map.get(depId));
    }
    result.push(t);
  }

  for (const t of taskList) visit(t);
  return result;
}

// ═══════════════════════════════════════════════════════
// SCHEDULING ALGORITHM
// ═══════════════════════════════════════════════════════

function scheduleAndRecommend(allTasks, hoursPerDay) {
  const now = new Date();

  // Only undone tasks
  const pending = allTasks.filter(t => !t.done);
  if (pending.length === 0) return { mode: 'empty', sequence: [], first: null };

  // Topo sort
  const sorted = topoSort(pending);

  // Separate deadlined vs sometime
  const withDeadline = sorted.filter(t => t.dueDate);
  const sometime = sorted.filter(t => !t.dueDate);

  // Helper: hours from now until deadline
  function hoursUntilDeadline(t) {
    if (!t.dueDate) return Infinity;
    return Math.max(0, (new Date(t.dueDate) - now) / 3600000);
  }

  // Helper: available work-hours in window of H hours at hoursPerDay work rate
  function availableHours(windowHours) {
    const days = windowHours / 24;
    return days * hoursPerDay;
  }

  // Check feasibility: simulate scheduling all tasks respecting deps and deadlines
  // using an earliest-deadline-first approach
  // Returns { feasible, costIfNotFeasible, sequence }

  function greedySchedule(taskSet) {
    // Build dependency map
    const idSet = new Set(taskSet.map(t => t.id));
    const inDegree = new Map(taskSet.map(t => [t.id, 0]));
    const rdeps = new Map(taskSet.map(t => [t.id, []])); // reverse deps

    for (const t of taskSet) {
      for (const d of (t.deps || [])) {
        if (idSet.has(d)) {
          inDegree.set(t.id, (inDegree.get(t.id) || 0) + 1);
          rdeps.get(d).push(t.id);
        }
      }
    }

    const taskMap = new Map(taskSet.map(t => [t.id, t]));
    let currentTime = 0; // hours from now
    const scheduled = [];
    const missed = [];
    const ready = [];

    // Initialize ready queue with tasks having no deps in this set
    for (const t of taskSet) {
      if (inDegree.get(t.id) === 0) ready.push(t);
    }

    function sortReady() {
      ready.sort((a, b) => {
        const da = hoursUntilDeadline(a);
        const db = hoursUntilDeadline(b);
        if (da !== db) return da - db; // EDF
        // tie-break: cost of failure descending
        return (b.costOfFailure || 0) - (a.costOfFailure || 0);
      });
    }

    while (ready.length > 0) {
      sortReady();
      const t = ready.shift();
      const start = currentTime;
      const end = currentTime + (t.estimatedHours || 0);
      currentTime = end;

      const wallEnd = new Date(now.getTime() + end * 3600000);
      const deadline = t.dueDate ? new Date(t.dueDate) : null;

      if (deadline && wallEnd > deadline) {
        missed.push(t);
      }

      scheduled.push({ task: t, start, end });

      for (const rid of rdeps.get(t.id)) {
        const newDeg = inDegree.get(rid) - 1;
        inDegree.set(rid, newDeg);
        if (newDeg === 0) ready.push(taskMap.get(rid));
      }
    }

    const totalCost = missed.reduce((s, t) => s + (t.costOfFailure || 0), 0);
    return { scheduled, missed, totalCost };
  }

  // Default EDF schedule
  const edfResult = greedySchedule(sorted);
  const feasible = edfResult.missed.length === 0;

  if (!feasible) {
    // ── MODE: Minimize cost of failure ──
    // We already have an EDF result; try to improve by prioritizing highest-cost tasks
    // Use a priority that mixes deadline urgency and cost

    // Alternative: sort by costOfFailure desc, respecting deps
    // We do a simple weighted approach: score = costOfFailure / hoursUntilDeadline
    const alts = [...sorted];
    alts.sort((a, b) => {
      const scoreA = (a.costOfFailure || 0) / Math.max(1, hoursUntilDeadline(a));
      const scoreB = (b.costOfFailure || 0) / Math.max(1, hoursUntilDeadline(b));
      return scoreB - scoreA;
    });

    // Re-run with topo constraint preserved but cost-weighted
    const costWeightedResult = greedySchedule(alts);

    // Pick whichever has less total cost
    const best = costWeightedResult.totalCost <= edfResult.totalCost ? costWeightedResult : edfResult;

    const sequence = best.scheduled.map(s => s.task);
    return {
      mode: 'minimize-cost',
      sequence,
      first: sequence[0] || null,
      missed: best.missed,
      totalCost: best.totalCost
    };
  }

  // ── MODE: Maximize S/D ──
  // S = costOfFailure + benefitOfSuccess of first task T with nonzero value
  // D = wall time (hours) until T is completed
  // We want to find the sequence (respecting topo order) such that S/D is maximized.
  // We try all valid topological orderings by checking which "ready" task to pick first.
  // For tractability we use a greedy: at each step pick the ready task with highest (S/D) where
  // D is estimated completion time from current position.

  function greedyMaxSD(taskSet) {
    const idSet = new Set(taskSet.map(t => [t.id, t]));
    const inDegree = new Map(taskSet.map(t => [t.id, 0]));
    const rdeps = new Map(taskSet.map(t => [t.id, []]));

    for (const t of taskSet) {
      for (const d of (t.deps || [])) {
        if (new Map(taskSet.map(x => [x.id, x])).has(d)) {
          inDegree.set(t.id, (inDegree.get(t.id) || 0) + 1);
          rdeps.get(d).push(t.id);
        }
      }
    }

    const taskMap = new Map(taskSet.map(t => [t.id, t]));
    let currentHours = 0;
    const sequence = [];
    const ready = [];
    let foundFirst = false;

    for (const t of taskSet) {
      if (inDegree.get(t.id) === 0) ready.push(t);
    }

    while (ready.length > 0) {
      // Find best ready task
      let best = null;
      let bestScore = -Infinity;

      for (const t of ready) {
        const S = (t.costOfFailure || 0) + (t.benefitOfSuccess || 0);
        const D = currentHours + (t.estimatedHours || 0);
        let score;

        if (!foundFirst && S > 0) {
          // We care about maximizing S/D for first valuable task
          score = S / Math.max(0.01, D);
        } else if (!foundFirst) {
          // No value, prefer shortest to unblock valuable tasks sooner
          score = -D;
        } else {
          // Already found first, keep going
          score = 0;
        }

        if (score > bestScore) { bestScore = score; best = t; }
      }

      // Remove best from ready
      ready.splice(ready.indexOf(best), 1);
      currentHours += best.estimatedHours || 0;
      sequence.push({ task: best, completedAt: currentHours });

      const S = (best.costOfFailure || 0) + (best.benefitOfSuccess || 0);
      if (!foundFirst && S > 0) foundFirst = true;

      for (const rid of rdeps.get(best.id)) {
        const newDeg = inDegree.get(rid) - 1;
        inDegree.set(rid, newDeg);
        if (newDeg === 0) ready.push(taskMap.get(rid));
      }
    }

    return sequence;
  }

  const sdSequence = greedyMaxSD(sorted);

  // Find first task T in the sequence with nonzero value
  let firstValueTask = null;
  let firstValueD = 0;
  let displaySequence = [];

  for (const item of sdSequence) {
    displaySequence.push(item.task);
    const S = (item.task.costOfFailure || 0) + (item.task.benefitOfSuccess || 0);
    if (S > 0 && !firstValueTask) {
      firstValueTask = item.task;
      firstValueD = item.completedAt;
      break;
    }
  }

  return {
    mode: 'maximize-sd',
    sequence: displaySequence,
    first: displaySequence[0] || null,
    firstValueTask,
    firstValueD
  };
}

// ═══════════════════════════════════════════════════════
// RENDER HERO
// ═══════════════════════════════════════════════════════

function formatDue(isoStr) {
  if (!isoStr) return 'Sometime';
  const d = new Date(isoStr);
  const now = new Date();
  const diff = d - now;
  if (diff < 0) return `<span class="overdue">Overdue: ${d.toLocaleDateString()}</span>`;
  const hrs = diff / 3600000;
  if (hrs < 48) return `Due in ${Math.round(hrs)}h`;
  const days = Math.round(hrs / 24);
  return `Due in ${days}d (${d.toLocaleDateString()})`;
}

function formatHours(h) {
  if (!h) return '—';
  if (h < 1) return `${Math.round(h * 60)}m`;
  return `${h}h`;
}

function renderHero() {
  const hoursPerDay = parseFloat(document.getElementById('hoursPerDay').value) || 8;
  const result = scheduleAndRecommend(tasks, hoursPerDay);
  const container = document.getElementById('heroContent');

  if (result.mode === 'empty') {
    container.innerHTML = `<div class="hero-empty">No pending tasks — you're all caught up!</div>`;
    return;
  }

  const first = result.first;
  const modeLabel = result.mode === 'minimize-cost'
    ? `<span class="badge badge-red">⚠ Deadlines at risk</span> — showing sequence to minimize cost of failure`
    : `<span class="badge badge-green">✓ On track</span> — showing sequence to maximize value/time`;

  const dueBadge = first.dueDate
    ? `<span>${formatDue(first.dueDate)}</span>`
    : `<span>Sometime</span>`;

  const heroHtml = `
    <div class="hero-now">
      <div class="hero-task-card">
        <div class="task-title">${esc(first.title)}</div>
        <div class="task-meta">
          ${dueBadge}
          <span>⏱ ${formatHours(first.estimatedHours)}</span>
          <span>💸 Cost: ${first.costOfFailure || 0}</span>
          <span>✨ Benefit: ${first.benefitOfSuccess || 0}</span>
        </div>
      </div>
    </div>
    <div class="hero-mode">${modeLabel}</div>
  `;

  const seqItems = result.sequence.map((t, i) => {
    const isFirst = i === 0;
    const isTarget = result.mode === 'maximize-sd' && t === result.firstValueTask;
    return `
      <li>
        <span class="seq-num">${i + 1}</span>
        <div class="seq-info">
          <div class="seq-title">${isFirst ? '<strong>' : ''}${esc(t.title)}${isFirst ? '</strong>' : ''}${isTarget ? ' <span class="badge badge-yellow">★ T</span>' : ''}</div>
          <div class="seq-meta">${formatHours(t.estimatedHours)} · ${t.dueDate ? formatDue(t.dueDate) : 'Sometime'}</div>
        </div>
      </li>
    `;
  }).join('');

  const seqTitle = result.mode === 'minimize-cost'
    ? 'Sequence to minimize missed cost'
    : 'Sequence to reach first valuable task T';

  container.innerHTML = heroHtml + `
    <div class="hero-sequence">
      <h3>${seqTitle}</h3>
      <ul class="sequence-list">${seqItems}</ul>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════
// RENDER TASK LIST
// ═══════════════════════════════════════════════════════

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function getTaskTitle(id) {
  return tasks.find(t => t.id === id)?.title || id;
}

function renderTasks() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const showDone = document.getElementById('showDone').checked;
  const container = document.getElementById('tasksList');

  let filtered = tasks.filter(t => {
    if (!showDone && t.done) return false;
    if (search && !t.title.toLowerCase().includes(search)) return false;
    return true;
  });

  if (filtered.length === 0) {
    container.innerHTML = `<div class="empty-state">No tasks. Click "+ New Task" to add one.</div>`;
    return;
  }

  container.innerHTML = filtered.map(t => {
    const depNames = (t.deps || []).map(d => `<span class="dep-tag">${esc(getTaskTitle(d))}</span>`).join('');
    return `
    <div class="task-item ${t.done ? 'done' : ''}" data-id="${t.id}">
      <input type="checkbox" class="task-check" ${t.done ? 'checked' : ''} title="Mark done" />
      <div class="task-body">
        <div class="task-name ${t.done ? 'done-text' : ''}">${esc(t.title)}</div>
        <div class="task-details">
          <span>⏱ ${formatHours(t.estimatedHours)}</span>
          ${t.dueDate ? `<span>${formatDue(t.dueDate)}</span>` : '<span>Sometime</span>'}
          ${(t.costOfFailure || 0) > 0 ? `<span>💸 ${t.costOfFailure}</span>` : ''}
          ${(t.benefitOfSuccess || 0) > 0 ? `<span>✨ ${t.benefitOfSuccess}</span>` : ''}
          ${depNames ? `<span>↳ Deps: ${depNames}</span>` : ''}
        </div>
      </div>
      <div class="task-actions">
        <button class="btn-ghost btn-sm" data-action="split" data-id="${t.id}" title="Split">✂</button>
        <button class="btn-ghost btn-sm" data-action="edit" data-id="${t.id}" title="Edit">✏</button>
        <button class="btn-ghost btn-sm" data-action="delete" data-id="${t.id}" title="Delete" style="color:var(--red)">🗑</button>
      </div>
    </div>
    `;
  }).join('');
}

function render() {
  renderHero();
  renderTasks();
}

// ═══════════════════════════════════════════════════════
// MODAL UTILITIES
// ═══════════════════════════════════════════════════════

function openModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.getElementById('modalContainer').appendChild(overlay);
  return overlay;
}

function closeModal() {
  const c = document.getElementById('modalContainer');
  if (c.lastChild) c.removeChild(c.lastChild);
}

// ═══════════════════════════════════════════════════════
// ADD / EDIT MODAL
// ═══════════════════════════════════════════════════════

function taskFormHtml(task, title) {
  const otherTasks = tasks.filter(t => t.id !== task?.id);
  const depIds = task?.deps || [];

  const depsOptions = otherTasks.map(t =>
    `<option value="${t.id}" ${depIds.includes(t.id) ? 'selected' : ''}>${esc(t.title)}</option>`
  ).join('');

  return `
    <h2>${title}</h2>
    <div class="form-row">
      <label>Title</label>
      <input id="fTitle" value="${esc(task?.title || '')}" placeholder="Task name" />
    </div>
    <div class="form-row">
      <label>Due date/time (leave blank for "sometime")</label>
      <input id="fDue" type="datetime-local" value="${task?.dueDate ? task.dueDate.slice(0,16) : ''}" />
    </div>
    <div style="display:flex;gap:12px;">
      <div class="form-row" style="flex:1">
        <label>Cost of failure</label>
        <input id="fCost" type="number" min="0" value="${task?.costOfFailure ?? 0}" />
      </div>
      <div class="form-row" style="flex:1">
        <label>Benefit of success</label>
        <input id="fBenefit" type="number" min="0" value="${task?.benefitOfSuccess ?? 0}" />
      </div>
    </div>
    <div class="form-row">
      <label>Estimated hours to complete</label>
      <input id="fHours" type="number" min="0.1" step="0.25" value="${task?.estimatedHours ?? 1}" />
    </div>
    <div class="form-row">
      <label>Dependencies (hold Ctrl/Cmd to select multiple)</label>
      <select id="fDeps" multiple style="height:80px;">${depsOptions}</select>
    </div>
    <div class="modal-footer">
      <button class="btn-ghost" id="btnCancel">Cancel</button>
      <button class="btn-primary" id="btnSave">Save</button>
    </div>
  `;
}

function openAddModal() {
  const overlay = openModal(taskFormHtml(null, 'New Task'));
  overlay.querySelector('#btnCancel').addEventListener('click', closeModal);
  overlay.querySelector('#btnSave').addEventListener('click', () => {
    const t = readForm(overlay);
    if (!t) return;
    t.id = genId();
    t.done = false;
    tasks.push(t);
    saveTasks(tasks);
    closeModal();
    render();
  });
}

function openEditModal(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;
  const overlay = openModal(taskFormHtml(task, 'Edit Task'));
  overlay.querySelector('#btnCancel').addEventListener('click', closeModal);
  overlay.querySelector('#btnSave').addEventListener('click', () => {
    const updated = readForm(overlay);
    if (!updated) return;
    Object.assign(task, updated);
    saveTasks(tasks);
    closeModal();
    render();
  });
}

function readForm(overlay) {
  const title = overlay.querySelector('#fTitle').value.trim();
  if (!title) { alert('Title is required'); return null; }
  const dueRaw = overlay.querySelector('#fDue').value;
  const dueDate = dueRaw ? new Date(dueRaw).toISOString() : null;
  const costOfFailure = parseFloat(overlay.querySelector('#fCost').value) || 0;
  const benefitOfSuccess = parseFloat(overlay.querySelector('#fBenefit').value) || 0;
  const estimatedHours = parseFloat(overlay.querySelector('#fHours').value) || 1;
  const depsSelect = overlay.querySelector('#fDeps');
  const deps = Array.from(depsSelect.selectedOptions).map(o => o.value);
  return { title, dueDate, costOfFailure, benefitOfSuccess, estimatedHours, deps };
}

// ═══════════════════════════════════════════════════════
// SPLIT MODAL
// ═══════════════════════════════════════════════════════

function openSplitModal(id) {
  const task = tasks.find(t => t.id === id);
  if (!task) return;

  let subtasks = [
    { title: task.title + ' (part 1)', hours: task.estimatedHours / 2 },
    { title: task.title + ' (part 2)', hours: task.estimatedHours / 2 }
  ];

  function buildSplitHtml() {
    const rows = subtasks.map((s, i) => `
      <div class="subtask-row" data-si="${i}">
        <div class="subtask-row-header">
          <span>Subtask ${i + 1}${i === subtasks.length - 1 ? ' (inherits cost/benefit/due)' : ' (sometime, 0/0)'}</span>
          ${subtasks.length > 2 ? `<button class="btn-ghost btn-sm" data-remove="${i}" style="color:var(--red)">Remove</button>` : ''}
        </div>
        <div style="display:flex;gap:8px;">
          <input class="st-title" data-si="${i}" value="${esc(s.title)}" placeholder="Subtask title" style="flex:1" />
          <input class="st-hours" data-si="${i}" type="number" min="0.1" step="0.25" value="${s.hours}" style="width:70px;" title="Hours" />
        </div>
      </div>
    `).join('');

    return `
      <h2>Split: "${esc(task.title)}"</h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:14px;">
        Creates a dependency chain. Last subtask inherits cost/benefit/due date.
      </p>
      <div id="splitRows">${rows}</div>
      <button class="btn-ghost" id="btnAddSub" style="margin-top:6px;">+ Add subtask</button>
      <div class="modal-footer">
        <button class="btn-ghost" id="btnCancelSplit">Cancel</button>
        <button class="btn-primary" id="btnConfirmSplit">Split</button>
      </div>
    `;
  }

  function attachSplitListeners(overlay) {
    overlay.querySelector('#btnCancelSplit').onclick = closeModal;

    overlay.querySelector('#btnAddSub').onclick = () => {
      subtasks.push({ title: task.title + ` (part ${subtasks.length + 1})`, hours: 1 });
      rebuildSplitModal(overlay);
    };

    overlay.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.remove);
        subtasks.splice(i, 1);
        rebuildSplitModal(overlay);
      };
    });

    overlay.querySelectorAll('.st-title').forEach(inp => {
      inp.oninput = () => {
        const i = parseInt(inp.dataset.si);
        subtasks[i].title = inp.value;
      };
    });

    overlay.querySelectorAll('.st-hours').forEach(inp => {
      inp.oninput = () => {
        const i = parseInt(inp.dataset.si);
        subtasks[i].hours = parseFloat(inp.value) || 1;
      };
    });

    overlay.querySelector('#btnConfirmSplit').onclick = () => {
      // Validate
      for (const s of subtasks) {
        if (!s.title.trim()) { alert('All subtasks need a title'); return; }
        if (!s.hours || s.hours <= 0) { alert('All subtasks need a positive hours estimate'); return; }
      }

      // Remove original task
      const origIdx = tasks.findIndex(t => t.id === id);
      const orig = tasks[origIdx];
      tasks.splice(origIdx, 1);

      // Create subtasks in chain
      const newIds = subtasks.map(() => genId());
      const newTasks = subtasks.map((s, i) => {
        const isLast = i === subtasks.length - 1;
        return {
          id: newIds[i],
          title: s.title.trim(),
          dueDate: isLast ? orig.dueDate : null,
          costOfFailure: isLast ? orig.costOfFailure : 0,
          benefitOfSuccess: isLast ? orig.benefitOfSuccess : 0,
          estimatedHours: s.hours,
          deps: i === 0
            ? (orig.deps || []).slice()
            : [...(orig.deps || []).filter(() => false), newIds[i - 1]],
          done: false
        };
      });

      // Fix deps: task 0 keeps orig's deps; each subsequent depends on previous
      newTasks[0].deps = (orig.deps || []).slice();
      for (let i = 1; i < newTasks.length; i++) {
        newTasks[i].deps = [newIds[i - 1]];
      }

      tasks.push(...newTasks);
      saveTasks(tasks);
      closeModal();
      render();
    };
  }

  function rebuildSplitModal(overlay) {
    overlay.querySelector('.modal').innerHTML = buildSplitHtml();
    attachSplitListeners(overlay);
  }

  const overlay = openModal(buildSplitHtml());
  attachSplitListeners(overlay);
}

// ═══════════════════════════════════════════════════════
// DELETE
// ═══════════════════════════════════════════════════════

function deleteTask(id) {
  if (!confirm('Delete this task?')) return;
  tasks = tasks.filter(t => t.id !== id);
  // Remove from deps
  tasks.forEach(t => { t.deps = (t.deps || []).filter(d => d !== id); });
  saveTasks(tasks);
  render();
}

// ═══════════════════════════════════════════════════════
// EVENT LISTENERS
// ═══════════════════════════════════════════════════════

document.getElementById('btnAdd').addEventListener('click', openAddModal);

document.getElementById('hoursPerDay').addEventListener('change', renderHero);

document.getElementById('searchInput').addEventListener('input', renderTasks);

document.getElementById('showDone').addEventListener('change', renderTasks);

document.getElementById('tasksList').addEventListener('click', e => {
  const taskItem = e.target.closest('.task-item');
  if (!taskItem) return;
  const id = taskItem.dataset.id;

  if (e.target.classList.contains('task-check')) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.done = e.target.checked;
      saveTasks(tasks);
      render();
    }
    return;
  }

  const action = e.target.closest('[data-action]')?.dataset.action;
  if (action === 'edit') openEditModal(id);
  else if (action === 'delete') deleteTask(id);
  else if (action === 'split') openSplitModal(id);
});

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════

render();
</script>
</body>
</html>
