<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
</head>
<body>
  <header>
    <h1>⚡ Task Manager</h1>
    <div class="header-controls">
      <span class="setting-label">Hours/day:</span>
      <input type="number" id="hoursPerDay" value="8" min="1" max="24" style="width:56px;" />
      <button class="btn-ghost" id="btnImport" title="Import tasks from JSON file">⬆ Import</button>
      <button class="btn-ghost" id="btnExport" title="Download all tasks as JSON">⬇ Export</button>
      <button class="btn-primary" id="btnAdd">+ New Task</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="hero-panel">
      <h2>What to do now</h2>
      <div id="heroContent"></div>
    </div>

    <div class="tasks-panel">
      <div class="tasks-toolbar">
        <input type="text" id="searchInput" placeholder="Search tasks…" style="max-width:260px;" />
        <label>
          <input type="checkbox" id="showDone" /> Show completed
        </label>
      </div>
      <div class="tasks-list" id="tasksList"></div>
    </div>
  </div>

  <div id="modalContainer"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
